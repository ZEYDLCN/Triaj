services:
  redis:
    image: redis/redis-stack-server:7.4.0-v1
    command: redis-server --save 60 1 --loadmodule /opt/redis-stack/lib/redisearch.so
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kong:
    image: kong:3.8
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: notice
      KONG_NGINX_PROXY_PROXY_BUFFERING: "off"
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    ports:
      - "8080:8000"   # tek giriş kapısı
      - "8001:8001"   # admin (sadece lokal)
    depends_on:
      redis: {condition: service_healthy}

  api:
    build: ./api
    environment:
      REDIS_URL: redis://redis:6379/0
      EMBED_MODEL: intfloat/multilingual-e5-small
      CACHE_THRESHOLD: "0.93"
    depends_on:
      redis: {condition: service_healthy}
    volumes:
      - hf-cache:/root/.cache/huggingface

  worker:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379/0
      BASE_MODEL: Qwen/Qwen2.5-1.5B-Instruct
      ADAPTER_PATH: /adapters/triaj-qlora
      LOAD_IN_4BIT: "1"
    depends_on:
      redis: {condition: service_healthy}
    volumes:
      - ./training/output:/adapters:ro
      - hf-cache:/root/.cache/huggingface
    # GPU varsa aç:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro

volumes:
  redis-data:
  hf-cache:
